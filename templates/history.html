<!DOCTYPE html>
<html>
<head>
    <title>Chat History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2>📜 Chat History</h2>

<a href="/" class="btn btn-primary mb-3">Back to Chat</a>

<table class="table table-bordered">

<tr>
    <th>User Message</th>
    <th>Bot Reply</th>
</tr>

{% for chat in chats %}
<tr>
    <td>{{ chat[0] }}</td>
    <td>{{ chat[1] }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
